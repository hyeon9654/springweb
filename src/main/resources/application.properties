spring.application.name=springweb
# 주석 : .properties 파일의 주석 방법
# application.properties 파일이란? spring 관련 설정 코드 입력하는곳 
# 1. 내장 톰캣의 포트 번호 변경 , 기본값이 8080 
server.port = 8080
# 2. 데이터베이스연동
# 2-1: 연동할 DB 주소
spring.datasource.url = jdbc:mysql://localhost:3306/mydb0902
# 2-2: DB주소의 계정명/비밀번호
spring.datasource.username=root
spring.datasource.password=1234
# 3. DDL
# create: 서버 실행될때 엔티티 기반으로 테이블 삭제->생성
# create-drop: 서버 실행될때 엔티티 기반으로 테이블
# update: 서버 실행될 대 존재하면 엔티티 수정 없
# none: 사용안함
spring.jpa.hibernate.ddl-auto=create-drop
# 4. SQL 콘솔 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true;
# 5. 서버 실행될 떄(DML) data.sql (경로) 파일 실행 , classpath(resources폴더)
spring.sql.init.data-locations=classpath*:/sql/0903.sql
spring.jpa.defer-datasource-initialization = true
